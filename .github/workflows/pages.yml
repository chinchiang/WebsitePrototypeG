name: GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Without this step nothing ever enables Pages for this repo, so
      # deploy-pages answers 404 "Ensure GitHub Pages has been enabled".
      # enablement: true creates the Pages site on the first run and pins its
      # build type to "workflow"; the job already carries pages: write.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate frontmatter
        run: npm run validate:frontmatter

      - name: Build for GitHub Pages subpath
        env:
          SITE_URL: https://chinchiang.github.io
          BASE_PATH: /WebsitePrototypeG/
        run: npm run build

      - name: Generate Pagefind index
        run: npm run pagefind

      - name: Check internal links
        env:
          BASE_PATH: /WebsitePrototypeG/
        run: npm run check:links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
